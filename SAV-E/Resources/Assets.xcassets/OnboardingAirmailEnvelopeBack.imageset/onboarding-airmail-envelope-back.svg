<svg width="360" height="250" viewBox="0 0 360 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="airmail" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="42" height="42" fill="#FFFDF7"/>
      <rect width="13" height="42" fill="#F27D5C"/>
      <rect x="21" width="13" height="42" fill="#A9DDEA"/>
    </pattern>
    <filter id="paperShadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3F281A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="358" height="248" rx="17" fill="url(#airmail)" filter="url(#paperShadow)"/>
  <!-- Open envelope liner: the letter covers the centre while the striped
       shoulder and side rails stay connected to the front pocket. -->
  <path d="M14 20H346V236H14V20Z" fill="#FFF8EE"/>
  <path d="M14 24Q180 66 346 24" stroke="#CBAE87" stroke-opacity="0.72" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M18 30Q180 72 342 30" stroke="#D8BE9A" stroke-opacity="0.42" stroke-width="1"/>
</svg>
