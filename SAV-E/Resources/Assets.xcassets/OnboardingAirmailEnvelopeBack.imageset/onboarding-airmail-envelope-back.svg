<svg width="360" height="220" viewBox="0 0 360 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="airmail" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="42" height="42" fill="#FFF9EF"/>
      <rect width="13" height="42" fill="#F27D5C"/>
      <rect x="21" width="13" height="42" fill="#A9DDEA"/>
    </pattern>
    <linearGradient id="kraftBacking" x1="180" y1="54" x2="180" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4DFC2"/>
      <stop offset="0.62" stop-color="#F2D6B1"/>
      <stop offset="1" stop-color="#F0D0A6"/>
    </linearGradient>
    <filter id="paperShadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#3F281A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- One open envelope back. Its V-shaped upper edge creates the folded
       point beneath the letter; the state card hides the centre and leaves
       only the connected striped rails and kraft shoulders visible. -->
  <g transform="scale(1 0.88)" filter="url(#paperShadow)">
    <path d="M3 54Q3 46 11 41L180 210L349 41Q357 46 357 54V238Q357 247 348 247H12Q3 247 3 238V54Z" fill="url(#airmail)"/>
    <!-- One continuous open liner: warm shoulders descend into the same
         central point while the centre above that point stays transparent. -->
    <path d="M9 58C45 70 82 116 180 202C278 116 315 70 351 58V232Q351 241 342 241H18Q9 241 9 232V58Z" fill="url(#kraftBacking)"/>
    <path d="M15 63C49 77 86 120 180 202C274 120 311 77 345 63" stroke="#C39562" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M10 229H350" stroke="#C39562" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="5 4"/>

    <!-- Subtle paper fibres; visible only in the narrow shoulders. -->
    <path d="M30 92L92 133" stroke="#FFF4E4" stroke-opacity="0.42" stroke-width="1"/>
    <path d="M330 92L268 133" stroke="#FFF4E4" stroke-opacity="0.42" stroke-width="1"/>
  </g>
</svg>
