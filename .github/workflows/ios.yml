name: Clip selection retry proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  clip-host-proof:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Record the tested production input hashes
      run: 'git rev-parse HEAD

        shasum -a 256 SAV-E/Models/PendingShareStore.swift SAV-EClip/PendingShareStore.swift
        SAV-EClip/ClipSaveService.swift scripts/check-clip-pending.py'
    - name: Execute real Clip retry persistence and app projection
      run: 'set +e

        python3 -B scripts/check-clip-pending.py > "$RUNNER_TEMP/clip-host-proof.log"
        2>&1

        status=$?

        set -e

        cat "$RUNNER_TEMP/clip-host-proof.log"

        exit "$status"'
    - name: Upload actual host result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: clip-selection-host-proof-${{ github.sha }}
        path: ${{ runner.temp }}/clip-host-proof.log
        if-no-files-found: error
        retention-days: 7
