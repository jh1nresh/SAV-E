name: PR339 live-map proof
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: true
        default: '42331788833'
        description: Existing iOS build run for frozen PR339 head
permissions:
  contents: read
  actions: read
concurrency:
  group: pr339-live-map-proof-b46d6a48
  cancel-in-progress: true
jobs:
  live-map-proof:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
    - name: Validate compiled source identity
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN: ${{ inputs.source_run_id }}
        EXPECTED_SHA: b46d6a48c2cd7d5dd6edea94460b2ed77a73bb83
        EXPECTED_CHECKOUT_SHA: 4a7fe6e70d9c730ba12198d6540650b1ae2db912
        EXPECTED_TREE: a38ec0e7b603c1dc3d8f75e6b683b1245b9dc370
      run: "gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN\" > \"$RUNNER_TEMP/source-run.json\"\ngh\
        \ api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs\" > \"$RUNNER_TEMP/source-jobs.json\"\ngh\
        \ api \"repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_CHECKOUT_SHA\" > \"$RUNNER_TEMP/checkout-commit.json\"\
        \npython3 - <<'PYCODE' \nimport json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\nrun=json.loads((root/'source-run.json').read_text())\n\
        jobs=json.loads((root/'source-jobs.json').read_text())['jobs']\ncheckout=json.loads((root/'checkout-commit.json').read_text())\n\
        assert checkout['tree']['sha']==os.environ['EXPECTED_TREE']\nassert run['head_sha']==os.environ['EXPECTED_SHA'],run['head_sha']\n\
        assert run['workflow_id']==390120565 and run['event']=='pull_request'\nassert any(j['name']=='ios-build'\
        \ and j['conclusion']=='success' for j in jobs)\n(root/'proof-source.json').write_text(json.dumps({'source_head':run['head_sha'],'source_run':run['id'],'source_checkout':checkout['sha'],'source_tree':checkout['tree']['sha'],'source_event':run['event'],'purpose':'four\
        \ optional live-map tests using existing compiled PR339 products'},indent=2))\nPYCODE\n"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: b46d6a48c2cd7d5dd6edea94460b2ed77a73bb83
    - name: Select Xcode 26.6
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
    - name: Verify toolchain
      run: xcodebuild -version
    - name: Download the existing PR339 test products
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: save-ios-test-products-${{ inputs.source_run_id }}
        path: ${{ runner.temp }}/SAVE-TestProducts-dl
        run-id: ${{ inputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: Locate transferred xctestrun
      id: products
      run: "tarball=\"$RUNNER_TEMP/save-ios-test-products.tar\"\nif [[ ! -f \"$tarball\" ]]; then\n  found=\"\"\n\
        \  while IFS= read -r candidate; do\n    found=\"$candidate\"\n    break\n  done < <(find \"$RUNNER_TEMP/SAVE-TestProducts-dl\"\
        \ -name 'save-ios-test-products.tar' -print 2>/dev/null)\n  if [[ -z \"$found\" ]]; then\n    echo 'error:\
        \ this-run test products were not restored from cache or artifact.' >&2\n    find \"$RUNNER_TEMP\" -maxdepth\
        \ 3 -name 'save-ios-test-products.tar' -print >&2 || true\n    exit 1\n  fi\n  tarball=\"$found\"\nfi\n\
        mkdir -p \"$RUNNER_TEMP/SAVE-DerivedData/Build/Products\"\ntar -C \"$RUNNER_TEMP/SAVE-DerivedData/Build/Products\"\
        \ -xf \"$tarball\"\nxctestrun=\"\"\nwhile IFS= read -r candidate; do\n  xctestrun=\"$candidate\"\n  break\n\
        done < <(find \"$RUNNER_TEMP/SAVE-DerivedData/Build/Products\" -name '*.xctestrun' | sort)\nif [[ -z \"\
        $xctestrun\" ]]; then\n  echo 'error: ios-build products are missing an .xctestrun file.' >&2\n  find \"\
        $RUNNER_TEMP/SAVE-DerivedData/Build/Products\" -maxdepth 3 -print >&2\n  exit 1\nfi\nexport XCTESTRUN_PATH=\"\
        $xctestrun\"\nexport SAVE_GOOGLE_PHOTO_EVIDENCE_DIR=\"/tmp/pr306-google-photo-attribution\"\npython3 - <<'PY'\n\
        import os\nimport pathlib\nimport plistlib\n\npath = pathlib.Path(os.environ[\"XCTESTRUN_PATH\"])\nevidence\
        \ = os.environ[\"SAVE_GOOGLE_PHOTO_EVIDENCE_DIR\"]\ndata = plistlib.loads(path.read_bytes())\n\ndef inject(node):\n\
        \    if isinstance(node, dict):\n        for key in (\"EnvironmentVariables\", \"TestingEnvironmentVariables\"\
        ):\n            env = node.get(key)\n            if isinstance(env, dict):\n                env[\"SAVE_GOOGLE_PHOTO_EVIDENCE_DIR\"\
        ] = evidence\n            elif \"BlueprintName\" in node or \"TestBundlePath\" in node:\n              \
        \  node[key] = {\"SAVE_GOOGLE_PHOTO_EVIDENCE_DIR\": evidence}\n        for value in node.values():\n   \
        \         inject(value)\n    elif isinstance(node, list):\n        for value in node:\n            inject(value)\n\
        \ninject(data)\npath.write_bytes(plistlib.dumps(data))\nprint(f\"injected SAVE_GOOGLE_PHOTO_EVIDENCE_DIR\
        \ into {path}\")\nPY\necho \"xctestrun=$xctestrun\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Create focused test simulator
      id: simulator
      run: "udid=\"$(xcrun simctl create \\\n  'SAV-E CI' \\\n  'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro'\
        \ \\\n  'com.apple.CoreSimulator.SimRuntime.iOS-26-5')\"\necho \"udid=$udid\" >> \"$GITHUB_OUTPUT\"\n# Boot\
        \ now and block until the device reports ready, so first-boot\n# work never lands inside a test's launch\
        \ budget. Letting xcodebuild\n# cold-boot the simulator is what surfaces as \"Timed out while\n# launching\
        \ application via Xcode\" on the first test of a step.\nxcrun simctl bootstatus \"$udid\" -b\n"
    - name: Verify live destination maps
      id: live_maps
      if: '!cancelled() && steps.products.outcome == ''success'' && steps.simulator.outcome == ''success'''
      timeout-minutes: 10
      env:
        SOURCE_XCTESTRUN: ${{ steps.products.outputs.xctestrun }}
        SIM_UDID: ${{ steps.simulator.outputs.udid }}
      run: "# Keep the normal unit/UI products and environment unchanged. Only\n# this explicit proof run admits\
        \ external public map requests.\nexport AMAP_XCTESTRUN=\"$(dirname \"$SOURCE_XCTESTRUN\")/SAVE-Amap-Proof.xctestrun\"\
        \npython3 - <<'PY'\nimport os\nimport pathlib\nimport plistlib\n\nsource = pathlib.Path(os.environ[\"SOURCE_XCTESTRUN\"\
        ])\ndata = plistlib.loads(source.read_bytes())\ninjected = []\ndef inject(node):\n    if isinstance(node,\
        \ dict):\n        if \"TestBundlePath\" in node:\n            injected.append(node[\"TestBundlePath\"])\n\
        \            for key in (\"EnvironmentVariables\", \"TestingEnvironmentVariables\"):\n                node.setdefault(key,\
        \ {})[\"SAVE_AMAP_CAPTURE\"] = \"1\"\n        for value in node.values():\n            inject(value)\n \
        \   elif isinstance(node, list):\n        for value in node:\n            inject(value)\ninject(data)\n\
        assert any(\"SAVETests\" in str(path) for path in injected), \"No unit-test host received the live capture\
        \ environment\"\npathlib.Path(os.environ[\"AMAP_XCTESTRUN\"]).write_bytes(plistlib.dumps(data))\nPY\nscripts/xcodebuild-clean.sh\
        \ \\\n  -xctestrun \"$AMAP_XCTESTRUN\" \\\n  -destination \"platform=iOS Simulator,id=$SIM_UDID\" \\\n \
        \ -parallel-testing-enabled NO \\\n  -test-timeouts-enabled YES \\\n  -default-test-execution-time-allowance\
        \ 90 \\\n  -maximum-test-execution-time-allowance 90 \\\n  -only-testing:SAVETests/SaveInkNotebookTests/testAmapDestinationCountryLookupForOptionalNetworkCapture\
        \ \\\n  -only-testing:SAVETests/SaveInkNotebookTests/testAmapOfficialEmbedRendersForOptionalNetworkCapture\
        \ \\\n  -only-testing:SAVETests/SaveInkNotebookTests/testAmapRawGCJEmbedRendersForOptionalNetworkCapture\
        \ \\\n  -only-testing:SAVETests/SaveInkNotebookTests/testAmapWGS84MarkerRendersForOptionalNetworkCapture\
        \ \\\n  -resultBundlePath \"$RUNNER_TEMP/SAVE-Amap-Proof.xcresult\" \\\n  CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO\
        \ \\\n  test-without-building\nxcrun xcresulttool get test-results summary \\\n  --path \"$RUNNER_TEMP/SAVE-Amap-Proof.xcresult\"\
        \ > \"$RUNNER_TEMP/SAVE-Amap-Proof-Summary.json\"\npython3 - \"$RUNNER_TEMP/SAVE-Amap-Proof-Summary.json\"\
        \ <<'PY'\nimport json\nimport sys\nresult = json.load(open(sys.argv[1]))\nassert result.get(\"passedTests\"\
        ) == 4 and result.get(\"failedTests\") == 0 and result.get(\"skippedTests\") == 0, result\nPY\n"
    - name: Export live map proof
      if: '!cancelled() && (steps.live_maps.outcome == ''success'' || steps.live_maps.outcome == ''failure'')'
      run: "if [[ -f \"$RUNNER_TEMP/SAVE-Amap-Proof.xcresult/Info.plist\" ]]; then\n  xcrun xcresulttool export\
        \ attachments \\\n    --path \"$RUNNER_TEMP/SAVE-Amap-Proof.xcresult\" \\\n    --output-path \"$RUNNER_TEMP/SAVE-Amap-Proof-Attachments\"\
        \nfi\n"
    - name: Upload live map proof
      if: '!cancelled() && (steps.live_maps.outcome == ''success'' || steps.live_maps.outcome == ''failure'')'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr339-live-map-proof-b46d6a48-${{ github.run_id }}
        path: '${{ runner.temp }}/SAVE-Amap-Proof.xcresult

          ${{ runner.temp }}/SAVE-Amap-Proof-Attachments

          ${{ runner.temp }}/SAVE-Amap-Proof-Summary.json


          ${{ runner.temp }}/proof-source.json'
        if-no-files-found: error
        retention-days: 7
    - name: Verify owned simulator shutdown
      if: always() && steps.simulator.outputs.udid != ''
      env:
        SIM_UDID: ${{ steps.simulator.outputs.udid }}
      run: 'xcrun simctl shutdown "$SIM_UDID" || true

        xcrun simctl list devices | grep -F "$SIM_UDID" | grep -Fq ''(Shutdown)''

        '
