name: PR339 country lookup diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  country-probe:
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Select Xcode 26.6
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
    - name: Probe public address without provider coordinate input
      run: 'python3 - <<''PYCODE''

        import subprocess

        subprocess.run([''swift'',''scripts/pr339-country-probe.swift''],check=True,timeout=100)

        PYCODE'
