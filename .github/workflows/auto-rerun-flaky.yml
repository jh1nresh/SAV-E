name: Auto-rerun flaky

# Listens for the CI workflow that hosts the required `backend / validate`
# check. Root retries live in backend `audit:production`; this only reruns
# that job after an npm audit registry/network timeout.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-rerun-flaky-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-npm-audit-timeout:
    # Completed cancelled runs also fire workflow_run. Never inspect or rerun them.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rerun backend validate only for npm audit network timeout
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          record() { tee -a "$summary"; }

          if [[ "$RUN_CONCLUSION" == "cancelled" ]]; then
            echo "cancelled run; never rerun" | record
            exit 0
          fi
          if (( RUN_ATTEMPT >= 3 )); then
            echo "run_attempt=${RUN_ATTEMPT}; not rerunning" | record
            exit 0
          fi

          run_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}")"
          status="$(jq -r .status <<<"$run_json")"
          api_conclusion="$(jq -r .conclusion <<<"$run_json")"
          if [[ "$status" != "completed" || "$api_conclusion" == "cancelled" ]]; then
            echo "run ${RUN_ID} status=${status} conclusion=${api_conclusion}; not rerunning" | record
            exit 0
          fi

          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" > jobs.json
          set +e
          job_id="$(
            python3 scripts/ci/should_rerun_npm_audit_timeout.py \
              --jobs-json jobs.json \
              --run-conclusion "${api_conclusion}" \
              --print-backend-job-id
          )"
          job_lookup=$?
          set -e
          if (( job_lookup != 0 )) || [[ -z "${job_id}" ]]; then
            echo "failed jobs are not only backend / validate, or run was cancelled; not rerunning" | record
            exit 0
          fi

          if ! gh run view "${RUN_ID}" --repo "${GH_REPO}" --job "${job_id}" --log > backend.log; then
            # gh api has no --follow. The logs endpoint 302s to a signed URL;
            # curl -L follows that redirect.
            if ! curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -L \
              "https://api.github.com/repos/${GH_REPO}/actions/jobs/${job_id}/logs" \
              > backend.log || [[ ! -s backend.log ]]; then
              echo "could not fetch backend / validate logs; not rerunning" | record
              exit 0
            fi
          fi
          set +e
          reason="$(
            python3 scripts/ci/should_rerun_npm_audit_timeout.py \
              --jobs-json jobs.json \
              --backend-log backend.log \
              --run-attempt "${RUN_ATTEMPT}" \
              --run-conclusion "${api_conclusion}"
          )"
          decision=$?
          set -e
          if (( decision == 2 )); then
            echo "classifier skipped rerun: ${reason}" | record
            exit 0
          fi
          if (( decision != 0 )); then
            echo "classifier failed with ${decision}: ${reason}" >&2
            exit "$decision"
          fi

          echo "Rerunning: ${reason}" | record
          gh api --method POST "repos/${GH_REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
