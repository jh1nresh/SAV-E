name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Keep required checks on the existing PR stack rooted in the #279 UI.
    # labeled + ready_for_review start the full ios-ui suite; ordinary
    # synchronize/opened/reopened events stay on the units-only lane.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches:
      - main
      - cursor/tile-town-product-lock-4894
      - codex/share-analysis-recovery
      - codex/p0-provider-status
      - codex/p1-share-keep-working
      - codex/p1-analysis-cost-efficiency
      - cursor/doodle-v1-home-eef3
  workflow_dispatch:
    inputs:
      ui_test_focus:
        description: >
          Optional SAVE_UI_TEST_FOCUS profile. Empty keeps default/full
          coverage with 3 retries. tile-town-home is the #279 iteration set
          (Home/Saves/Trips rail tests, one attempt). Ignored on main.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PRs share a group so superseded runs cancel. Non-PR events (main push,
  # workflow_dispatch) use run_id so they never share a group: GitHub still
  # drops pending jobs in a group even when cancel-in-progress is false.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compile-only gate so an iOS compile error fails in ~10 min instead of
  # waiting on the 75-minute unit+UI job. No tests and no simulator boot.
  ios-build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Cache SwiftPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/SAVE-DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SAV-E.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/SAVE-DerivedData/Build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('SAV-E.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'SAV-E.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build app, Share Extension, and tests without booting a simulator
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

  # Units-only lane for ordinary PR pushes (opened/synchronize/reopened
  # without ready-for-merge). Target ~10 min on a warm DerivedData cache.
  # Skipped when ios-ui runs so the merge gate does not occupy two macos-26
  # runners for the same SAVETests.
  ios-unit:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'ready_for_review' &&
      !contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
    needs: [ios-build]
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Check secrets packaging
        run: scripts/test-package-google-places-secrets.sh

      - name: Cache SwiftPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/SAVE-DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SAV-E.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/SAVE-DerivedData/Build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('SAV-E.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'SAV-E.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build without booting a simulator
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Create focused test simulator
        id: simulator
        run: |
          udid="$(xcrun simctl create \
            'SAV-E CI' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-26-5')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Boot now and block until the device reports ready, so first-boot
          # work never lands inside a test's launch budget.
          xcrun simctl bootstatus "$udid" -b

      - name: Run unit tests
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            -only-testing:SAVETests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Tear down simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          cleanup_status=0
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          if ! xcrun simctl list devices |
            grep -F '${{ steps.simulator.outputs.udid }}' |
            grep -Fq '(Shutdown)'; then
            echo 'Simulator shutdown could not be verified.' >&2
            cleanup_status=1
          fi
          if ! xcrun simctl delete '${{ steps.simulator.outputs.udid }}'; then
            echo 'Simulator deletion failed.' >&2
            cleanup_status=1
          elif xcrun simctl list devices | grep -Fq '${{ steps.simulator.outputs.udid }}'; then
            echo 'Simulator deletion could not be verified.' >&2
            cleanup_status=1
          fi
          exit "$cleanup_status"

  # Full UI + snapshot + visual-parity suite (~63 min). Runs on main, manual
  # dispatch, ready_for_review, and PRs labeled ready-for-merge. Skipped on
  # ordinary PR pushes; the required `ios` check is filled by the reporter.
  ios-ui:
    name: ios (UI + visual parity)
    if: >
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
    needs: [ios-build]
    runs-on: macos-26
    # The UI suite is ~10 minutes on a healthy runner but has been observed at
    # 3-4x that on a contended one, and failing tests are now retried.
    timeout-minutes: 75
    env:
      # Re-enabled for the 2026-10-15 pixel-art pass. Disable again after the
      # focused set is green, then run one full suite as the merge gate.
      SAVE_UI_TEST_FOCUS: ${{ github.event.inputs.ui_test_focus || (github.head_ref == 'cursor/tile-town-product-lock-4894' && 'tile-town-home') || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify CI test selection
        run: python3 -B -m unittest discover -s Tests/ci -p 'test_*.py' -v

      - name: Select iOS coverage
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/select-ios-tests.py --output-dir "$RUNNER_TEMP"

      - name: Upload test selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-test-selection-${{ github.sha }}
          path: ${{ runner.temp }}/ios-test-selection.json
          if-no-files-found: error
          retention-days: 14

      - name: Select Xcode 26.6
        if: steps.scope.outputs.run == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify toolchain
        if: steps.scope.outputs.run == 'true'
        run: xcodebuild -version

      - name: Check secrets packaging
        if: steps.scope.outputs.run == 'true'
        run: scripts/test-package-google-places-secrets.sh

      - name: Verify account preservation fixtures
        if: steps.scope.outputs.run == 'true'
        run: |
          scripts/check-account-export.sh
          scripts/check-entitlements.sh
          python3 -B -m unittest discover -s Tests/account_preservation -p 'test_*.py' -v

      - name: Cache SwiftPM packages
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/SAVE-DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SAV-E.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build without booting a simulator
        if: steps.scope.outputs.run == 'true'
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Create focused test simulator
        id: simulator
        if: steps.scope.outputs.run == 'true'
        run: |
          udid="$(xcrun simctl create \
            'SAV-E CI' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-26-5')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Boot now and block until the device reports ready, so first-boot
          # work never lands inside a test's launch budget. Letting xcodebuild
          # cold-boot the simulator is what surfaces as "Timed out while
          # launching application via Xcode" on the first test of a step.
          xcrun simctl bootstatus "$udid" -b

      - name: Run unit tests
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.units == 'true'
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            -only-testing:SAVETests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Reset focused simulator before UI tests
        if: steps.scope.outputs.ui == 'true'
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl erase '${{ steps.simulator.outputs.udid }}'
          # An erased device does first-boot work on the next boot. Do it here
          # rather than inside the first test's app launch.
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b

      # -retry-tests-on-failure is the backstop for simulator-level faults the
      # test code cannot defend against (wedged backboard, "Failed to get
      # background assertion"), which have taken out whole runs on main. It
      # only re-runs tests that failed, so a green run costs nothing, and a
      # genuine regression still fails all three attempts. Any retry that did
      # happen is surfaced by the next step rather than being swallowed.
      - name: Run selected UI regression tests
        id: ui_tests
        # Job budget is 75. 60 was too tight once Plan replaced Origin: unit
        # tests plus four UI tests that needed three attempts (run 33905649737)
        # hit the 1h wall while Home-Saves was still running.
        timeout-minutes: 55
        if: steps.scope.outputs.ui == 'true'
        env:
          SAVE_XCODEBUILD_LOG: ${{ runner.temp }}/SAVE-UI-tests.log
        run: |
          ui_args=()
          while IFS= read -r argument; do
            ui_args+=("$argument")
          done < "$RUNNER_TEMP/ios-ui-args.txt"
          if ((${#ui_args[@]} == 0)); then
            echo 'UI coverage was selected but no test arguments were produced.' >&2
            exit 1
          fi
          # Default keeps the 3-attempt retry backstop. Focus mode must omit
          # -test-iterations entirely: xcodebuild rejects `-test-iterations 1`
          # ("Must specify -test-iterations with more than 1 iteration").
          iteration_args=(-test-iterations 3 -retry-tests-on-failure)
          if [[ -n "${SAVE_UI_TEST_FOCUS:-}" ]]; then
            echo "SAVE_UI_TEST_FOCUS=${SAVE_UI_TEST_FOCUS}: focused UI set, one attempt, no retry."
            iteration_args=()
          fi
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SAVE-UI.xcresult" \
            "${ui_args[@]}" \
            "${iteration_args[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Enforce Atlas production visual parity
        if: steps.scope.outputs.ui == 'true'
        run: |
          Prototypes/AtlasPostcard/Scripts/run-visual-parity.sh \
            --result-bundle "$RUNNER_TEMP/SAVE-UI.xcresult" \
            --artifacts "$RUNNER_TEMP/SAVE-Atlas-Parity" \
            --threshold 0.90

      - name: Export first-run visual evidence
        if: always() && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'failure')
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/SAVE-UI.xcresult" \
            --output-path "$RUNNER_TEMP/SAVE-First-Run"

      - name: Reset focused simulator before Trip sheet UI test
        if: steps.scope.outputs.trip == 'true'
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl erase '${{ steps.simulator.outputs.udid }}'
          # An erased device does first-boot work on the next boot. Do it here
          # rather than inside the first test's app launch.
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b

      - name: Run Trip atlas sheet family UI test
        timeout-minutes: 15
        if: steps.scope.outputs.trip == 'true'
        env:
          SAVE_XCODEBUILD_LOG: ${{ runner.temp }}/SAVE-Trip-Sheets-tests.log
        run: |
          scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SAVE-Trip-Sheets.xcresult" \
            -only-testing:SAVEUITests/SAVEScreenshotRailTests/testTripStopEditorSurfaceIsReachable \
            -test-iterations 3 \
            -retry-tests-on-failure \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/SAVE-Trip-Sheets.xcresult" \
            --output-path "$RUNNER_TEMP/SAVE-Trip-Sheets"

      # A retried test reports as a pass, which is the point — but silently
      # passing on the second attempt is exactly how ambient flake hides. Name
      # every test that needed more than one attempt so the trend stays visible
      # even while the job is green.
      - name: Report retried UI tests
        if: always() && (steps.scope.outputs.ui == 'true')
        run: |
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/SAVE-*-tests.log)
          if ((${#logs[@]} == 0)); then
            echo "No UI test logs found; nothing to report."
            exit 0
          fi
          # `|| true`: this step must never be the reason a job fails. Under
          # `bash -eo pipefail` a grep that matches nothing exits 1, which
          # would turn "the UI step died before running any test" into a
          # second, misleading failure right next to the real one.
          retried="$(
            cat "${logs[@]}" |
              grep -oE "Test Case '-\[[^]]+\]' (passed|failed)" |
              sed -E "s/^Test Case '-\[(.+)\]' .*/\1/" |
              sort | uniq -c |
              awk '$1 > 1 { printf "%s attempts: %s %s\n", $1, $2, $3 }' || true
          )"
          if [[ -z "$retried" ]]; then
            echo "No UI test needed a retry."
            exit 0
          fi
          while IFS= read -r line; do
            echo "::warning title=Flaky UI test::$line"
          done <<< "$retried"

      - name: Tear down simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          cleanup_status=0
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          if ! xcrun simctl list devices |
            grep -F '${{ steps.simulator.outputs.udid }}' |
            grep -Fq '(Shutdown)'; then
            echo 'Simulator shutdown could not be verified.' >&2
            cleanup_status=1
          fi
          if ! xcrun simctl delete '${{ steps.simulator.outputs.udid }}'; then
            echo 'Simulator deletion failed.' >&2
            cleanup_status=1
          elif xcrun simctl list devices | grep -Fq '${{ steps.simulator.outputs.udid }}'; then
            echo 'Simulator deletion could not be verified.' >&2
            cleanup_status=1
          fi
          exit "$cleanup_status"

      - name: Upload Atlas parity evidence
        if: always() && (steps.scope.outputs.ui == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-atlas-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SAVE-Atlas-Parity
            ${{ runner.temp }}/SAVE-First-Run
            ${{ runner.temp }}/SAVE-Trip-Sheets
            ${{ runner.temp }}/SAVE-*-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build unsigned release candidate without a simulator
        if: github.event_name == 'push'
        run: |
          release_plist="$RUNNER_TEMP/CI-Release-Secrets.plist"
          trap 'rm -f "$release_plist"' EXIT
          cp SAV-E/Resources/Secrets.plist.template "$release_plist"
          plutil -replace GOOGLE_PLACES_API_KEY \
            -string 'CI_BUILD_ONLY_NON_SECRET_VALUE' \
            "$release_plist"
          chmod 600 "$release_plist"
          SAVE_EXPECTED_API_URL="https://save-backend-production.up.railway.app" \
          SAVE_RELEASE_SECRETS_PLIST="$release_plist" scripts/xcodebuild-clean.sh \
            -project SAV-E.xcodeproj \
            -scheme SAV-E \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SAVE-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  # Required check name `ios` (ruleset main-pr-and-ci). Always reports so a
  # skipped ios-ui job cannot stay pending and block merge. Succeeds when the
  # active iOS test lane succeeds; fails if that lane failed or none ran.
  ios:
    if: always()
    needs: [ios-build, ios-unit, ios-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required iOS check
        env:
          BUILD_RESULT: ${{ needs.ios-build.result }}
          UNIT_RESULT: ${{ needs.ios-unit.result }}
          UI_RESULT: ${{ needs.ios-ui.result }}
        run: |
          echo "ios-build=$BUILD_RESULT"
          echo "ios-unit=$UNIT_RESULT"
          echo "ios-ui=$UI_RESULT"
          echo "Full suite: label a PR ready-for-merge, convert it to ready for review, or push to main."
          fail=0
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "ios-build did not succeed: $BUILD_RESULT" >&2
            fail=1
          fi
          if [[ "$UNIT_RESULT" == "failure" || "$UNIT_RESULT" == "cancelled" ]]; then
            echo "ios-unit did not succeed: $UNIT_RESULT" >&2
            fail=1
          fi
          if [[ "$UI_RESULT" == "failure" || "$UI_RESULT" == "cancelled" ]]; then
            echo "ios-ui did not succeed: $UI_RESULT" >&2
            fail=1
          fi
          if [[ "$UNIT_RESULT" != "success" && "$UI_RESULT" != "success" ]]; then
            echo "No iOS test lane ran." >&2
            fail=1
          fi
          exit "$fail"

  backend:
    uses: jh1nresh/.github/.github/workflows/node-ci.yml@0cb6fd5b730ced897c767d1c9979aba4e49d201d
    with:
      node-version: "22"
      working-directory: backend
      lockfile: backend/package-lock.json
      # Registry 503s are retried in backend `validate`, not the reusable audit step.
      check-script: validate
      audit-production: false
      job-key: save-backend
      timeout-minutes: 12

  save-contracts:
    runs-on: ubuntu-latest
    # save-rn `npm ci` is ~5m. Empty {summary,detail} on run 33857607310
    # (~25s) is the same registry flake as #186. Audit then skip-flakes.
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: save-rn/package-lock.json

      - name: Install dependencies
        working-directory: save-rn
        run: npm ci

      - name: Validate import, sharing, card, and action fixtures
        working-directory: save-rn
        run: |
          npm run check:import-links
          npm run check:friend-share
          npm run check:app-clip-invoke
          npm run check:save-cards
          npm run check:save-actions
          node --test scripts/check-production-audit.test.js

      - name: Audit production dependencies
        working-directory: save-rn
        run: npm run audit:production

  evidence-rubric:
    uses: jh1nresh/.github/.github/workflows/node-ci.yml@0cb6fd5b730ced897c767d1c9979aba4e49d201d
    with:
      node-version: "22"
      working-directory: services/evidence-rubric
      lockfile: services/evidence-rubric/package-lock.json
      check-script: test
      audit-production: true
      job-key: save-evidence-rubric
      timeout-minutes: 8

  release-readiness:
    if: github.event_name == 'push'
    needs: [ios, backend, save-contracts, evidence-rubric]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write release-readiness receipt
        run: |
          python3 scripts/write-save-release-readiness.py \
            --output "$RUNNER_TEMP/save-release-readiness.json" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 -m json.tool "$RUNNER_TEMP/save-release-readiness.json" >/dev/null

      - name: Upload release-readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-release-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/save-release-readiness.json
          if-no-files-found: error
          retention-days: 14
