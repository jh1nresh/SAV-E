name: AtlasPostcardPrototype
options:
  bundleIdPrefix: com.wanderly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  AtlasPostcardPrototype:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderly.atlaspostcardprototype
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: SAV-E Atlas
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  AtlasPostcardPrototypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AtlasPostcardPrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderly.atlaspostcardprototype.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AtlasPostcardPrototype:
    build:
      targets:
        AtlasPostcardPrototype: all
        AtlasPostcardPrototypeUITests: [test]
    test:
      targets:
        - AtlasPostcardPrototypeUITests
