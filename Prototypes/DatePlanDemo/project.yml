name: SavvyDateDemo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    COMPILER_INDEX_STORE_ENABLE: NO
targets:
  SavvyDateDemo:
    type: application
    platform: iOS
    sources: [Sources, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.savvy.date-preview
        INFOPLIST_KEY_CFBundleDisplayName: Savvy 約會預覽
  SavvyDateDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SavvyDateDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.savvy.date-preview.uitests
schemes:
  SavvyDateDemo:
    build:
      targets:
        SavvyDateDemo: all
    test:
      targets: [SavvyDateDemoUITests]
