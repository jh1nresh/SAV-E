<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<title>Savvy · 台北 101 收藏地圖</title>
<style>
:root{--canvas:#fdf8f3;--paper:#fffdf7;--forest:#0e4a33;--ink:#2e2117;--muted:#62594f;--mint:#d6e8c4;--honey:#ffcc4f;--line:#ddd1bc;--serif:"Songti TC","Noto Serif TC","Georgia",serif;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--canvas)}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.44}img{display:block;width:100%;object-fit:cover}
a{color:inherit;text-underline-offset:3px}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #927018;outline-offset:3px}
[hidden]{display:none!important}
header{border-bottom:1px solid var(--line);background:var(--paper)}
.nav,main{width:min(1420px,100% - 96px);margin:auto}
.nav{height:62px;display:flex;align-items:center;justify-content:space-between}
.brand{color:var(--forest);font:700 33px/.95 Georgia,serif;letter-spacing:-2.3px}
.nav-left{display:flex;align-items:center;gap:17px}.nav-divider{height:19px;width:1px;background:var(--line)}.nav-label{font-size:13px;font-weight:650;letter-spacing:.12em;color:var(--forest)}
.demo{font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.mast{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:25px 0 20px}
.location{color:#42614f;font-size:12px;font-weight:720;letter-spacing:.16em;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.location svg{width:14px;height:14px}
h1,h2,h3,p,figure{margin:0}h1{font-family:var(--serif);font-size:clamp(40px,4.8vw,68px);font-weight:700;letter-spacing:-.055em;line-height:.99;color:var(--forest)}h1 span{font-family:Georgia,serif;font-size:1.15em;font-weight:500}
.meta{font-size:12px;line-height:1.6;color:var(--muted);text-align:right;padding-bottom:3px}
.atlas{display:grid;grid-template-columns:minmax(0,1fr) 324px;gap:16px;align-items:start}
.stage{height:clamp(490px,calc(100svh - 245px),725px);position:relative;overflow:hidden;isolation:isolate;content-visibility:auto;contain-intrinsic-block-size:auto 490px;border:1px solid #d7c9ac;border-radius:20px;background-color:#f6edda;background-image:radial-gradient(ellipse at 49% 43%,#fffbef 0%,#fbf5e6a6 47%,#eddfc580 100%),radial-gradient(circle at 1px 1px,#b4a07972 .65px,transparent .85px);background-size:auto,14px 14px}
.stage::after{content:"";position:absolute;inset:11px;border:1px solid #b9a68455;border-radius:12px;pointer-events:none;z-index:-1}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}canvas.dragging{cursor:grabbing}
.map-controls{position:absolute;z-index:3;top:20px;right:20px;display:flex;gap:7px;align-items:center}
.control-set{display:flex;border:1px solid #d5c5a4;padding:3px;border-radius:10px;background:#fffaf0;box-shadow:0 2px 4px #43331a12}
.control{width:41px;height:40px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center}
.control:first-child+.control{border-left:1px solid #eee2ca}.control:hover,.control[aria-pressed="true"]{background:#ebebd6;color:var(--forest)}
.control svg{width:18px;height:18px}
.compass{position:absolute;top:22px;left:23px;color:#51705c;text-align:center;width:29px;font:700 11px Georgia,serif;pointer-events:none}
.compass svg{display:block;width:24px;height:26px;margin:3px auto}
.map-bottom{position:absolute;bottom:21px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;color:#5f5748;font-size:11px;font-weight:600}
.scale-line{display:block;height:5px;border:1px solid #726751;border-top:0;max-width:150px;margin-top:2px}
.loading{position:absolute;inset:0;display:grid;place-content:center;color:var(--forest);pointer-events:none}
.stamps{position:absolute;inset:0;pointer-events:none}
.stamp{position:absolute;transform:translate(-50%,calc(-100% - var(--lift,14px)));pointer-events:auto;isolation:isolate;border:1px solid #9b8245;border-radius:9px;background:#fff9e9;color:#3b3827;box-shadow:0 4px 10px #493b2340;padding:0 9px 0 6px;min-height:44px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:700}
.stamp::after{position:absolute;content:"";height:var(--leader,14px);width:1px;top:100%;left:50%;background:#84682c;transform-origin:top;transform:rotate(var(--leader-angle,0deg))}
.stamp::before{position:absolute;content:"";bottom:calc(-1 * var(--lift,14px) - 4px);left:calc(50% + var(--anchor-offset,0px));width:7px;height:7px;border:1px solid #816c42;border-radius:50%;transform:translateX(-50%);background:var(--honey)}
.stamp:hover,.stamp[aria-pressed="true"]{background:#fff1bc;border-color:#8b6a25;z-index:2}.stamp[aria-pressed="true"]{box-shadow:0 0 0 2px #ffe7a7,0 5px 13px #493b2338}
.stamp-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #8d784b;border-radius:50%;background:#faeac0;color:#62471e;flex:none}
.stamp-mark svg{width:16px;height:16px}
.sidebar{display:grid;gap:14px;min-width:0}
.memory{background:var(--paper);border:1px solid var(--line);padding:12px 12px 13px;border-radius:18px;box-shadow:0 4px 12px #493b2309}
.photo{position:relative;background:#ddd4b8;border-radius:11px;overflow:hidden;border:1px solid #e5d9bf}
.photo img{height:clamp(170px,25vh,256px)}
.photo-credit{padding:7px 4px 0;font-size:10px;color:var(--muted);line-height:1.45}
.memory-body{padding:11px 6px 1px}
.state{display:inline-flex;background:var(--mint);color:#275040;font-size:11px;line-height:1.5;font-weight:700;padding:3px 8px;border-radius:5px;gap:5px;align-items:center}
.state.wishlist{background:#f5e5ca;color:#664318}
.state svg{width:12px;height:12px}
h2{font-family:var(--serif);font-size:25px;letter-spacing:-.035em;color:var(--forest);line-height:1.2;margin:8px 0 6px}
.detail-meta{font-size:11px;color:var(--muted);letter-spacing:.04em}
.note{margin:13px 0 0;border-top:1px dashed #d7c6a8;padding-top:10px;font-size:13px;line-height:1.75;color:#494034}
.note strong{display:block;color:var(--forest);font-size:11px;letter-spacing:.12em;margin-bottom:3px}
.collection{padding:0 3px 3px}
.collection-title{font-size:12px;font-weight:750;color:var(--forest);padding:2px 3px 7px;letter-spacing:.1em}
.collection ul{display:grid;gap:5px;list-style:none;margin:0;padding:0}
.collection button{border:1px solid transparent;background:transparent;border-radius:10px;display:flex;align-items:center;text-align:left;padding:5px 8px;width:100%;min-height:44px;gap:9px;font-size:12px;font-weight:710}
.collection button[aria-pressed="true"],.collection button:hover{background:#f2ead9;border-color:#ddcfb2}
.collection .stamp-mark{width:28px;height:28px}
.collection .row-name{flex:1}.row-state{color:#665e52;font-weight:500;font-size:10px}
.credit{display:flex;flex-wrap:wrap;gap:4px 12px;padding:13px 0 19px;color:#6a5f51;font-size:10px;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:1050px){.nav,main{width:calc(100% - 46px)}.atlas{grid-template-columns:minmax(0,1fr) 280px}.mast{padding-top:28px}}
@media(max-width:730px){.nav,main{width:calc(100% - 28px)}.nav{height:53px}.nav-left{gap:11px}.brand{font-size:29px}.nav-label{font-size:11px}.mast{padding:21px 0 15px}.atlas{grid-template-columns:minmax(0,1fr);gap:12px}.stage{height:clamp(410px,59svh,510px);border-radius:16px}.map-controls{right:13px;top:13px}.compass{top:16px;left:15px}.map-bottom{bottom:16px;left:16px;right:16px}.stamp{max-width:131px;font-size:10px;padding-right:6px}.stamp span:last-child{overflow:hidden;text-overflow:ellipsis}.stamp-mark{width:24px;height:24px}.stamp-mark svg{width:13px;height:13px}.photo img{height:190px}.memory-body{padding-bottom:3px}.sidebar{gap:10px}}
@media(max-width:365px){.control{width:35px}.meta{display:none}.stamp{max-width:44px;overflow:visible;padding:6px;justify-content:center}.stamp span:last-child{display:none}}
</style>
</head>

<header><div class="nav"><div class="nav-left"><span class="brand">Savvy</span><span class="nav-divider" aria-hidden="true"></span><span class="nav-label">我的地圖</span></div><span class="demo">互動原型</span></div></header>
<main>
  <section class="mast" aria-labelledby="title">
    <div>
      <p class="location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>台北市 · 信義區</p>
      <h1 id="title">台北 <span>101</span></h1>
    </div>
    <p class="meta">250 × 250 公尺<br>3 枚收藏印章</p>
  </section>
  <section class="atlas" aria-label="收藏地圖與筆記">
    <div class="stage" id="stage">
      <canvas id="map" tabindex="0" aria-label="台北 101 微縮地圖" aria-describedby="map-keys"></canvas>
      <span id="map-keys" class="sr-only">用方向鍵旋轉和調整俯角，加減號縮放，Home 鍵重設。點選收藏印章閱讀照片和筆記。</span>
      <div class="loading" id="loading" role="status">載入街景中…</div>
      <div class="stamps" id="stamps"></div>
      <div class="compass" aria-hidden="true">N<svg id="needle" viewBox="0 0 30 32"><path fill="#4f745c" d="m15 2 6 25-6-5-6 5z"/><path fill="#b6a687" d="m15 2 6 25-6-5z"/></svg></div>
      <div class="map-controls" aria-label="地圖控制">
        <div class="control-set">
          <button type="button" class="control" id="out" aria-label="縮小" title="縮小"></button>
          <button type="button" class="control" id="in" aria-label="放大" title="放大"></button>
        </div>
        <div class="control-set">
          <button type="button" class="control" id="turn" aria-label="旋轉地圖" title="旋轉地圖"></button>
          <button type="button" class="control" id="bird" aria-label="俯瞰" title="俯瞰" aria-pressed="false"></button>
          <button type="button" class="control" id="reset" aria-label="重設視角" title="重設視角"></button>
          <button type="button" class="control" id="playback"></button>
        </div>
      </div>
      <div class="map-bottom" aria-hidden="true"><div>20 m<span class="scale-line" id="scale-line"></span></div><span>拖曳旋轉 · 點印章看筆記</span></div>
    </div>
    <aside class="sidebar">
      <article class="memory" id="memory" aria-labelledby="memory-title">
        <figure>
          <div class="photo"><img id="memory-photo" alt=""></div>
          <figcaption class="photo-credit" id="photo-credit"></figcaption>
        </figure>
        <div class="memory-body">
          <div class="state" id="memory-state"></div>
          <h2 id="memory-title"></h2>
          <p class="detail-meta" id="memory-meta"></p>
          <div class="note"><strong>示範筆記</strong><p id="memory-note"></p></div>
        </div>
      </article>
      <section class="collection" aria-labelledby="collection-title">
        <h3 class="collection-title" id="collection-title">收藏印章</h3>
        <ul id="collection"></ul>
      </section>
    </aside>
  </section>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <footer class="credit">
    <span>街景為插畫，塔樓高度經縮放</span>

  </footer>

/* ---------- palettes ---------- */

  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const SUN=norm([-.47,-.63,.91]);
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(n,SUN),.28,-.30,m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(n,SUN),.54,-.08,m);   // interior / props
const MIX_MEMO = new Map();
const mix = (a,b,t) => { const k = a + b + t; let r = MIX_MEMO.get(k);
  if (r === undefined){ if (MIX_MEMO.size > 60000) MIX_MEMO.clear();
    r = '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join(''); MIX_MEMO.set(k, r); }
  return r; };
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
// a filled shape and its outline as one element (projected once): stroke #231e15 marks an outline that the pages treat like
// a separate detail line drawn over the fill, which is exactly what one element with fill then stroke paints
const shape = (pts,c,w=.9) => { const d = pd(pts); return w ? `<path d="${d}" fill="${c}" stroke="#231e15" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>` : fill(d,c); };
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

let VIEW_BOX = null;
const offView = (fp, z0, z1, m = 8) => { if (!VIEW_BOX) return false; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const q of fp) for (const z of [z0, z1]){ const [X, Y] = P(q[0], q[1], z); if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y; }
  return x1 < -m || y1 < -m || x0 > VIEW_BOX[0] + m || y0 > VIEW_BOX[1] + m; };

/* Pocket City trees, shared by both cities: the eight styles picked from the tree gallery (numbers as in the gallery).
   1 linden · 2 elm vase · 3 chestnut · 4 dense · 5 airy · 6 chunky · 7 column · 18 spruce
   A tree is a branching skeleton (round-capped strokes) and a few hundred small flat leaf cards, built once in world
   coordinates. A frame only projects it: the wood, then the back leaves, then the front ones, with the leaves of one colour
   and one tone merged into one shape, so a tree is about a dozen elements. The shadows are illustrative.
   Needs core3d.js (pd, depthOf, vis, rotV, L, CAM_K, norm, cross, mix). */
// a phone-sized page draws lighter (fewer leaves and people, no glazing bars); the page tells its frame workers its width
const PHONE = self.PHONE_PROFILE;
const TREE_LOD = +(new URLSearchParams(self.PAGE_SEARCH ?? location.search).get('leaves') || (PHONE ? .22 : .35));   // city scale: a third of the gallery's leaves, each larger
const TREE_FORM = {   // fork: where the trunk splits (share of height); w: crown half-width (share of height); vase: wider at the top
  1: { fork: .3,  w: .34, limbs: 5, leader: true,  twigs: 4, count: 230, size: .058, spread: .22 },
  2: { fork: .28, w: .38, limbs: 5, vase: .5,      twigs: 4, count: 230, size: .058, spread: .22 },
  3: { fork: .3,  w: .42, limbs: 6,                twigs: 4, count: 250, size: .06,  spread: .22 },
  4: { fork: .3,  w: .34, limbs: 5,                twigs: 5, count: 420, size: .038, spread: .2 },
  5: { fork: .35, w: .24, limbs: 6, leader: true,  twigs: 4, count: 120, size: .04,  spread: .3, wood: .7 },
  6: { fork: .3,  w: .36, limbs: 5,                twigs: 3, count: 90,  size: .1,   spread: .2 },
  7: { fork: .2,  w: .14, limbs: 6, leader: true,  twigs: 4, count: 220, size: .045, spread: .14 },
};
// makeTree(style, { x, y, z0, H, seed, m, m2, share2, lod }): m is the leaf colour {l, m, d}; m2 an optional second colour
// mixed in at share2;
// lod < 1 keeps that share of the leaves and makes each one larger, so the crown covers the same area with less to draw
function makeTree(style, { x, y, z0 = 0, H = 11, seed = 1, m, m2, share2 = .35, lod = 1 }){
  let sd = Math.floor(seed * 7919) % 2147483646 + 1; const R = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
  const lerp3 = (a, b, k) => [a[0] + (b[0]-a[0])*k, a[1] + (b[1]-a[1])*k, a[2] + (b[2]-a[2])*k];
  const add3 = (a, b, k = 1) => [a[0] + b[0]*k, a[1] + b[1]*k, a[2] + b[2]*k];
  const segs = [], twigs = [], leaves = [], base = [x, y, z0];
  if (style === 18){   // spruce: a straight trunk and twelve tiers of drooping needle cards, narrowing to the tip
    const k0 = H / 11; segs.push([base, [x, y, z0 + H*.8], .16*k0]);   // the trunk ends inside the top tiers
    for (let k = 0; k < 12; k++){ const z = z0 + (1.6 + k*.78)*k0, r = (3.1*(1 - k/12) + .3)*k0, n = Math.max(6, Math.round(r/k0*5));
      for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2 + k*.4 + R()*.2, out = [Math.cos(a), Math.sin(a), 0], c = [x + out[0]*r*.55, y + out[1]*r*.55, z - .25*k0];
        const nn = norm([out[0]*.5, out[1]*.5, 1]), t = norm([out[0], out[1], -.45]), sd2 = cross(nn, t), L2 = r*.55, W = .45*k0;
        leaves.push({ c, n: nn, m, pts: [add3(c, t, -L2), add3(c, sd2, W), add3(c, t, L2), add3(c, sd2, -W)] }); } }
    leaves.forEach((lf, i) => { lf.k = (i*.618034) % 1; lf.j = (i*.754878 + .5) % 1; });
    return { x, y, segs, twigs: [], leaves, zc: z0 + H*.45, zTop: z0 + H, ext: 3.4*k0 };
  }
  const fm = TREE_FORM[style] || TREE_FORM[1], wood = fm.wood || 1, vase = fm.vase || 0;
  const zf = z0 + H*fm.fork, zc = (zf + z0 + H)/2 + H*.04, rz = (z0 + H - zf)/2, C = [x, y, zc];
  // the crown's outer shell at height u (-1 bottom .. 1 top) and direction a: an ellipsoid, a vase leans its width up
  const shell = (u, a) => { const k = Math.sqrt(Math.max(0, 1 - u*u)) * (1 + vase*(u - .2)); return [x + Math.cos(a)*H*fm.w*k, y + Math.sin(a)*H*fm.w*k, zc + u*rz]; };
  segs.push([base, [x, y, zf], (.1 + H*.008)*wood]);
  const tips = [], n = fm.limbs + (fm.leader ? 1 : 0);
  for (let k = 0; k < n; k++){
    const lead = fm.leader && k === n - 1, a = k/fm.limbs*Math.PI*2 + R()*.9;
    const u = lead ? .85 : (vase ? .25 + R()*.45 : -.05 + R()*.5);
    const end = lead ? [x, y, zc + rz*.85] : lerp3(C, shell(u, a), .78), mid = lerp3([x, y, zf], end, .5); mid[2] += H*.03;
    const r0 = (.045 + H*.0045)*wood; segs.push([[x, y, zf], mid, r0], [mid, end, r0*.65]);
    for (let j = 0; j < fm.twigs; j++){
      const tip = lerp3(C, shell(Math.max(-.7, Math.min(.9, u + (R() - .5)*.7)), a + (R() - .5)*1.1), .92);
      twigs.push([lerp3(mid, end, .4 + R()*.6), tip, r0*.35]); tips.push(tip); }   // twigs show only when the crown is bare
  }
  // leaves: small kite-shaped cards around the twig tips, each turned its own way (mostly facing up and out)

        ink.fillStyle=r>.48?'rgba(247,229,204,'+(.04+r*.11)+')':'rgba(68,72,82,'+(.06+r*.15)+')';ink.fillRect(x+.75,y+.75,30.8,size/12-1.3);

function rect(x,y,w,d){return [[x-w/2,y-d/2],[x+w/2,y-d/2],[x+w/2,y+d/2],[x-w/2,y+d/2]]}
const polygon=(x,y,r,n,angle=0)=>Array.from({length:n},(_,i)=>[x+r*Math.cos(i*2*Math.PI/n+angle),y+r*Math.sin(i*2*Math.PI/n+angle)]);
const footprintPath=r=>pd(atZ(r,0)),surface=(rings,color)=>'<path d="'+rings.map(footprintPath).join('')+'" fill="'+color+'" fill-rule="evenodd"/>';

// Elevations run right-to-left as seen from outside, so lettering is drawn turned round about its anchor.
function wallText(g,str,x,y,w){const a=g.textAlign;g.save();g.translate(x,y);g.scale(-1,1);g.textAlign=a==='start'||a==='left'?'right':a==='end'||a==='right'?'left':a;g.fillText(str,0,0,w);g.restore()}

/* ---------- the look of each building: city.json rules, then per-building overrides ---------- */
const STYLES=CITY.styles||{};
function matches(c,b){
  if(!c)return true;
  const any=(v,x)=>Array.isArray(v)?v.includes(x):v===x;
  if(c.type&&!any(c.type,b.type))return false;
  if(c.use&&!any(c.use,b.use))return false;
  if(c.mat&&!any(c.mat,b.mat))return false;
  if(c.famous!==undefined&&!!b.famous!==c.famous)return false;
  if(c.cut!==undefined&&!!b.cut!==c.cut)return false;
  if(c.name&&!new RegExp(c.name,'i').test(b.n||''))return false;
  const h=b.h??(b.lv?b.lv*LEVEL:null);
  if(c.minH!==undefined&&!(h>=c.minH))return false;
  if(c.maxH!==undefined&&!(h!==null&&h<=c.maxH))return false;
  if(c.minLevels!==undefined&&!((b.lv??(h?h/LEVEL:0))>=c.minLevels))return false;
  if(c.maxLevels!==undefined&&!((b.lv??(h?h/LEVEL:99))<=c.maxLevels))return false;
  if(c.minArea!==undefined&&!(b.area>=c.minArea))return false;
  if(c.maxArea!==undefined&&!(b.area<=c.maxArea))return false;
  if(c.unknownHeight!==undefined&&(b.h==null&&b.lv==null)!==c.unknownHeight)return false;
  if(c.nearStreet!==undefined&&b.street!==c.nearStreet)return false;
  return true;
}
function styleFor(b){
  let s={facade:'house',wall:['#eee2ca'],roofColour:['#c8c4b8'],roof:'auto',pitch:30,eaves:.45,levels:3,floor:LEVEL,shop:'poi',parapet:.5,...(STYLES.default||{})};
  for(const rule of STYLES.rules||[])if(matches(rule.if,b)){s={...s,...rule.set};if(!rule.more)break}
  return {...s,...((CITY.buildings||{})[b.id]||{})};
}
const POIS=SCENE.pois||[];
const areaOf=r=>Math.abs(r.reduce((s,p,i)=>{const q=r[(i+1)%r.length];return s+p[0]*q[1]-q[0]*p[1]},0)/2);
const nearStreet=b=>b.ring.some((a,i)=>{const c=b.ring[(i+1)%b.ring.length],m=[(a[0]+c[0])/2,(a[1]+c[1])/2];
  return [[3,0],[-3,0],[0,3],[0,-3]].some(([dx,dy])=>inRings([m[0]+dx,m[1]+dy],SCENE.roads))});
for(const b of SCENE.buildings){
  b.area=areaOf(b.ring);b.street=nearStreet(b);b.pois=[];
}
for(const p of POIS){   // a named shop belongs to the building it stands in, or the nearest one within 6 m
  let best=null,bd=6;
  for(const b of SCENE.buildings){if(inside([p.x,p.y],b.ring)){best=b;break}
    for(let i=0;i<b.ring.length;i++){const a=b.ring[i],c=b.ring[(i+1)%b.ring.length],dx=c[0]-a[0],dy=c[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy||1)));
      const d=Math.hypot(a[0]+dx*t-p.x,a[1]+dy*t-p.y);if(d<bd){bd=d;best=b}}}
  if(best)best.pois.push(p);
}
function heightsOf(b,st){
  const pitched=roofKind(b,st)!=='flat';
  const rise=pitched?(b.rh||(ridgeFrame(b,st).W/2+st.eaves)*Math.tan(st.pitch*Math.PI/180)):0;
  let wall;
  if(b.h)wall=pitched?Math.max(2.6,b.h-rise):b.h;
  else if(b.lv)wall=b.lv*st.floor+(pitched?0:.6);
  else wall=(st.levels||3)*st.floor+(pitched?0:.6);

/* ---------- walls: one face per footprint edge, each with a painted elevation ---------- */
const models=[],facades=[];
function walls(r,z,h,info){

  const faces=r.map((a,i)=>{
    const b=r[(i+1)%r.length],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(len<.05)return null;
    const u=[(b[0]-a[0])/len,(b[1]-a[1])/len],n=[u[1]*Math.sign(area),-u[0]*Math.sign(area),0];
    const flip=area>0,start=flip?b:a,along=flip?u.map(v=>-v):u;
    const cut=BASE_CORNERS.some((v,j)=>{const w=BASE_CORNERS[(j+1)%4];return Math.abs(v[0]-w[0])<.01?Math.abs(a[0]-v[0])<.05&&Math.abs(b[0]-v[0])<.05:Math.abs(a[1]-v[1])<.05&&Math.abs(b[1]-v[1])<.05});
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const street=!cut&&[2.2,4.5,7].some(d=>{const q=[mid[0]+n[0]*d,mid[1]+n[1]*d];return inRings(q,SCENE.roads)||inRings(q,SCENE.walk)||inRings(q,SCENE.paths)});

    const id=facades.push({start,along,n,len,z,h,st,cut,shop,sign,seed:hash((bld?bld.id:'')+i),body:info.body,street})-1;
    return {a,b,n,id};
  }).filter(Boolean);
  return ()=>faces.filter(q=>vis(q.n)).sort((a,b)=>depthOf([...a.a,0])-depthOf([...b.a,0])).map(q=>{
    const wall=[...atZ([q.a,q.b],z),...atZ([q.b,q.a],h)],fac=facades[q.id];
    return shape(wall,tone(q.n,soft(info.body)),.7)+'<elevation id="'+q.id+'"/>'+(fac.shop&&fac.st.awning!==false?canopy(fac):'')+(fac.street&&fac.st.eave1&&!fac.cut?midEave(fac):'');

// a shop awning or canopy over each bay of a shopfront
function canopy(F){
  const st=F.st,cols=st.awnings||(CITY.shops||{}).awnings||['#af7762','#688d86','#b59972','#7a8aa8'];
  const bays=Math.max(1,Math.round(F.len/(st.bay||5.5))),bay=F.len/bays,height=Math.min(F.h-F.z-.3,st.shopHeight?st.shopHeight-.2:3.2);
  const at=(s,d,z)=>[F.start[0]+F.along[0]*s+F.n[0]*d,F.start[1]+F.along[1]*s+F.n[1]*d,z];
  let svg='';
  for(let i=0;i<bays;i++){
    if(st.awning==='some'&&(F.seed+i)%3)continue;
    const a=bay*i+.25,b=bay*(i+1)-.25,proj=st.awningDepth||.9,front=height-.42,c=cols[(F.seed+i)%cols.length];
    svg+=shape([at(a,0,height),at(b,0,height),at(b,proj,front),at(a,proj,front)],c,.36);
    if(UPX<.55&&st.stripes!==false)for(let t=a+.12;t<b-.2;t+=.6){const u=Math.min(b,t+.24);svg+=shape([at(t,0,height+.012),at(u,0,height+.012),at(u,proj,front+.012),at(t,proj,front+.012)],'#efe2c6',0)}
    svg+=shape([at(a,proj,front),at(b,proj,front),at(b,proj,front-.16),at(a,proj,front-.16)],mix(c,'#726d78',.3),.3);
  }

// a small tiled pent roof between ground and first floor (machiya ichimon-ji eave, shophouse eaves)

/* ---------- painted elevations ---------- */
function paintSingaporeElevation(g,id){
  const F=facades[id],{start,along,n,len:L,z,h,st}=F,H=h-z;
  if(L<.38||H<.48)return;
  const X=Dv(...along,0),Y=Dv(0,0,-1),p=P(...start,h);
  g.save();g.transform(...X,...Y,...p);g.beginPath();g.rect(0,0,L,H);g.clip();
  const box=(x,y,w,d,c)=>{g.fillStyle=c;g.fillRect(x,y,w,d)};
  const poly=(ps,c)=>{g.fillStyle=c;g.beginPath();ps.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()};
  const side=dot(n,SUN)>.14,shade=c=>nightCol(side?c:mix(c,'#8e839a',.19)),lit=i=>SEASON.night&&rnd(F.seed*.013+i*3.71)<(SEASON.litShare??.55);

  const glass=(st.glass||['#b4d3cd','#c0d7ca','#a5c6cc','#d9d6b6']).map(shade);

  if(UPX>1.1){g.restore();return}

  const floors=Math.max(1,Math.round(upper/fl)),rh=upper/Math.max(1,floors);

  function win(x,y,w,d,i){   // one window: frame, glass with a glint, glazing bars
    box(x-.09,y-.09,w+.18,d+.18,frame);
    if(lit(i)){box(x,y,w,d,(i+F.seed)%3?'#ffd98a':'#ffe7a8')}
    else{box(x,y,w,d,glass[(i+F.seed)%glass.length]);poly([[x,y],[x+w*.42,y],[x+w*.14,y+d],[x,y+d]],shade('#e2e8dc'))}
    if(st.bars!==false){box(x+w*.5-.03,y,.06,d,trim);if(d>1.2)box(x,y+d*.32,w,.05,trim)}
  }

      box(x,y,bw+.01,3.6,glass[(Math.floor(i/5)+Math.floor(j/3)+F.seed)%glass.length]);box(x,y,.08,3.6,frame);box(x,y+3.25,bw,.12,frame);
      if((i+j+F.seed)%11===2)poly([[x,y+.3],[x+bw*.6,y+.3],[x+bw*.2,y+3.1],[x,y+3.1]],shade('#d4e2da'))}
  }else if(kind==='office'){
    for(let j=0;j<floors;j++){const y=j*rh;box(0,y+rh*.24,L,rh*.5,glass[(j+F.seed)%glass.length]);
      for(let i=1;i<cols;i++)box(i*bw,y+rh*.24,.07,rh*.5,frame);box(0,y+rh*.74,L,.08,trim)}
  }else if(kind==='timber'){   // Kyoto-style townhouse: plastered upper storey with slit windows over wooden lattice

      if(j===floors-1&&!F.shop){   // ground floor without a shop: wooden lattice (koshi) across the front

        for(let x=.08;x<L;x+=.11)box(x,y+rh*.14,.045,rh*.84,shade(st.slat||'#8d6e55'));

  }else if(kind==='plain'||kind==='warehouse'){
    for(let j=0;j<floors;j++)for(let i=0;i<cols;i++)if((i+j+F.seed)%(kind==='warehouse'?3:2)===0)win(bw*i+bw*.3,j*rh+rh*.3,bw*.4,rh*.35,i+j);
  }else if(kind==='striped'){   // Ligurian/Genoese church walls: horizontal bands, a few tall arched windows

    for(let i=0;i<n;i++){const w=.9,x=(i+.5)*L/n-w/2,y0=upper*.18,d=Math.min(3.4,upper*.32);
      box(x-.18,y0-.18,w+.36,d+.3,trim);box(x,y0+w/2,w,d-w/2,shade('#5b6266'));poly(Array.from({length:9},(_,k)=>[x+w/2+Math.cos(Math.PI+k*Math.PI/8)*w/2,y0+w/2+Math.sin(Math.PI+k*Math.PI/8)*w/2]).concat([[x+w,y0+w/2],[x,y0+w/2]]),shade('#5b6266'))}

      for(let i=0;i<cols;i++){const w=Math.min(1.05,bw*.3),x=bw*i+(bw-w)/2,y0=y+rh*.2,d=rh*.56;if(bw<1.2)continue;
        box(x-.26,y0-.32,w+.52,d+.5,tr);                      // painted surround

        const c=shade(pickOf(sh,F.seed+i+j)),shut=(x0,ww)=>{box(x0,y0,ww,d,c);for(let k=y0+.12;k<y0+d-.05;k+=.16)box(x0+.05,k,ww-.1,.04,mix(c,'#1f2a22',.35))};

// which way the ridge runs: along the footprint (long), across it (short), or parallel to the street it faces (street)
function ridgeFrame(b,st){
  const o=b.obb;let ax=o.ax,L=o.L,W=o.W;

  if(mode==='street'){
    let best=null,bl=0;

      const m=[(a[0]+c[0])/2,(a[1]+c[1])/2],u=[(c[0]-a[0])/len,(c[1]-a[1])/len];
      const hit=[3,6].some(d=>[[u[1],-u[0]],[-u[1],u[0]]].some(n=>inRings([m[0]+n[0]*d,m[1]+n[1]*d],SCENE.roads)||inRings([m[0]+n[0]*d,m[1]+n[1]*d],SCENE.walk)));
      if(hit&&len>bl){bl=len;best=u}}
    mode=best&&Math.abs(best[0]*ax[0]+best[1]*ax[1])<.7?'short':'long';
  }

}

    let s=shape(q.p,tone(q.n,soft(q.wall?wallC:roofC)),.6);
    if(!q.wall&&tex&&!SEASON.snow&&q.p.length===4){const u=norm(sub(q.p[1],q.p[0])),v=norm(sub(q.p[0],q.p[3]));s+=sheetInk(q.p,tex,u,v.map(x=>-x))}

function flatRoof(b,st,wall,col){

      if(rnd(x*3.1+y*9.7+hash(b.id))>.16)continue;const fp=rect(x,y,2.6,1.8);if(!fp.every(p=>inside(p,r)))continue;

/* ccw(ring): the same outline running counter-clockwise. OSM outlines run either way; faces you build yourself from a ring

/* standable(x, y): a person or a prop can stand here: inside the plot, not on water, not inside a building, and at least

    if(gap>0)for(const r of w)for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1,

/* ---------- night (a season or occasion with night: true) ----------
   Every colour the painter fills is turned to dusk; the warm light colours below stay as they are, so windows,
   shopfronts, lamps and fairy lights read as lit. No glow: lights are flat bright marks, like the rest of the style. */
const LIT=new Set(['#ffe6ec','#fbd3dd','#ffd98a','#ffe7a8','#fff3c4','#fbefc8','#f6c445','#ffb85c','#fff8e0','#f2c94c','#fde9b0','#ffcf7a','#ff8a3d','#f26a2e','#ffc069']);
const NIGHTC=new Map();
function nightCol(c){
  if(!SEASON.night||typeof c!=='string'||c[0]!=='#'||LIT.has(c))return c;
  let o=NIGHTC.get(c);if(o)return o;
  let h=c.slice(1);if(h.length===3||h.length===4)h=h.slice(0,3).split('').map(x=>x+x).join('');if(h.length<6)return c;
  const n=parseInt(h.slice(0,6),16),r=n>>16,g=n>>8&255,b=n&255,K=SEASON.night===true?1:+SEASON.night;
  const R=Math.round(r*(1-.5*K)+12*K),G=Math.round(g*(1-.52*K)+16*K),B=Math.round(b*(1-.4*K)+40*K);   // dusk: keep each colour's hue, sink it toward blue
  o='#'+((1<<24)+(Math.min(255,R)<<16)+(Math.min(255,G)<<8)+Math.min(255,B)).toString(16).slice(1);NIGHTC.set(c,o);return o;
}
const softNight=m=>SEASON.night&&m?{l:nightCol(m.l),m:nightCol(m.m),d:nightCol(m.d)}:m;
if(typeof compileInk==='function'){const inkOps=compileInk;compileInk=function(markup){const ops=inkOps(markup);
  if(SEASON.night)for(const op of ops){if(op.fill)op.fill=nightCol(op.fill);if(op.stroke)op.stroke=nightCol(op.stroke)}return ops}}

  const L=b.l,W=Math.max(1.5,L*.31),ca=Math.cos(b.a*Math.PI/180),sa=Math.sin(b.a*Math.PI/180),k=b.k;

    let g='';

      let n=norm([b1[1]-a1[1],-(b1[0]-a1[0]),-.12]);const mx=(a1[0]+b1[0])/2-b.x,my=(a1[1]+b1[1])/2-b.y;

      for(const t of [-.3,.2])g+=shape([at(t*L/2-.12,-W*.28,.8),at(t*L/2+.12,-W*.28,.8),at(t*L/2+.12,W*.28,.8),at(t*L/2-.12,W*.28,.8)],BOATCFG.inside,.3)}

/* ---------- occasion decorations: bunting across the main streets, lanterns under shop eaves, flags on lamps ---------- */

      DECOR.push({fp:rect(x,y,.5,.5),h:z+.2,draw:()=>stick([x,y,z+.15],[x,y,z-.15],.02,'#3d3a44')+stick([x,y,z-.28],[x,y,z-.78],.2,c)+stick([x,y,z-.24],[x,y,z-.3],.12,'#2f2b33')+stick([x,y,z-.8],[x,y,z-.86],.12,'#2f2b33')})}}}
  if(d.fairy){   // strings of small lights along street fronts (under the eaves and over the shops) and the quay edge

/* ---------- the ground: plate, streets, green, water, markings, shadows ---------- */

function cityGround(){

  for(const l of SCENE.lawns)g+=surface(l.r,GRASS);
  for(const w of SCENE.water||[])g+=surface(w,WATER);
  for(const w of SCENE.sand||[])g+=surface(w,SEASON.snow?snowy(PAL.sand,.8):PAL.sand);
  for(const w of SCENE.quayShade||[])g+=surface(w,mix(WATER,'#2f6474',.32));   // the quay wall's shadow on the water
  for(const p of SCENE.walk)g+=surface(p,WALK);
  for(const p of SCENE.paths)g+=surface(p,PAVE);
  for(const p of SCENE.roads)g+=surface(p,ROAD);
  for(const p of SCENE.quay||[])g+=surface(p,SEASON.snow?'#f4f1ea':PAL.quay);   // stone coping along the water's edge
  if(SEASON.night)for(const [x,y] of LAMP_AT)g+=lightPool(x,y,3.4,'#ffcf7a',.55);
  if(SEASON.night&&SEASON.decor&&SEASON.decor.litTrees){const re=new RegExp(SEASON.decor.litTrees,'i');for(const tr of TREES)if(re.test(tr.species))g+=lightPool(tr.x,tr.y,tr.ext*1.3+1,'#fff3c4',.5)}
  g+='<pavementink/>';
  let paint='';
  for(const lane of CENTER)for(let s=3;s<lane.len-2;s+=7.4){const {p,d}=tAt(lane,s);paint+=stripeAt(p,d,2.9,.15)}
  for(const lane of CROSSING)for(let s=.4;s<lane.len;s+=1.1){const {p,d}=tAt(lane,s);paint+=stripeAt(p,d,.46,2.4)}
  if(paint)g+=fill(paint,SEASON.snow?'#f7f3ea':PAL.marking);
  for(const r of SCENE.rails||[])for(const off of [-.72,.72]){const L=measuredLane({p:r.p,junctions:[]}),pts=[];for(let s=0;s<=L.len;s+=1){const {p,d}=tAt(L,s);pts.push([p[0]-d[1]*off,p[1]+d[0]*off,.02])}
    if(pts.length>1)g+='<path d="'+pd(pts,false)+'" fill="none" stroke="'+PAL.rail+'" style="stroke-width:'+f(.11)+'"/>'}
  let sh='';
  for(const m of models)sh+=castShadow([...atZ(m.fp,0),...atZ(m.fp,Math.min(m.h,30))]);
  for(const tr of TREES)sh+=castShadow([...atZ(sq(tr.x,tr.y,.35),0),...atZ(polygon(tr.x,tr.y,tr.ext*.72,10),tr.h*.68)]);
  const slabWalls=BASE_CORNERS.map((a,i)=>{const b=BASE_CORNERS[(i+1)%4],n=norm([b[1]-a[1],a[0]-b[0],0]);
    let svg=vis(n)?shape([[...a,-SLAB],[...b,-SLAB],[...b,0],[...a,0]],tone(n,soft(PAL.slab)),.7):'';

/* Each worker builds the same fixed-tick simulation. Its projected model uses a small vector vocabulary.

let positionedCamera = '';

function animateStreet(now) {
  playbackFrame = requestAnimationFrame(animateStreet);
  if (lastStep === null) {
    lastStep = now;
    return;
  }
  const elapsed = now - lastStep;
  if (elapsed < 1000 / 18 || busy) return;
  lastStep = now;
  simulationTime += Math.min(elapsed, 100) / 1000;
  scheduleDraw();
}

function syncPlayback() {
  if (playing && renderingStage && !document.hidden) {
    if (!playbackFrame) playbackFrame = requestAnimationFrame(animateStreet);
    return;
  }
  cancelAnimationFrame(playbackFrame);
  playbackFrame = 0;
  lastStep = null;
}

function setPlaying(next) {
  playing = next;
  const label = playing ? '暫停街景' : '播放街景';
  playback.innerHTML = icon(playing ? 'pause' : 'play');
  playback.setAttribute('aria-label', label);
  playback.title = label;
  syncPlayback();
}

const clamp = (value, min, max) => Math.max(min,Math.min(max,value));
const anchors = records.map(record => record.anchor);
const engine = byId('render-engine').textContent;
let worker, frameRenderer, queued, busy = false;
let frameId = 0;
const loading = byId('loading');

function drawFrame(message) {
  if (worker) {
    worker.postMessage(message);
  } else if (frameRenderer) {
    try {
      displayFrame({...frameRenderer(message), cameraKey:message.cameraKey});
    } catch(error) {
      fail(error);
    }
  }
}
function scheduleDraw() {
  if (frameId) return;
  frameId = requestAnimationFrame(() => {
    frameId = 0;
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;
    const shot = {...camera,zoom:camera.zoom*Math.min((width-22)/415,(height-38)/365)/Math.min(width/302,height/202)};
    const cameraKey = [width, height, ...Object.values(shot)].join(',');
    queued = {width,height,dpr:Math.min(devicePixelRatio || 1,1.65),camera:shot,cameraKey,anchors,time:simulationTime,wobble:0,finish:'wash',season:'day'};
    flushFrame();
  });
}
function flushFrame() {
  if (!queued || busy) return;
  busy = true;
  const current = queued;
  queued = null;
  drawFrame(current);
}
function displayFrame(frame) {
  busy = false;
  if (frame.error) {
    restartWithoutWorker(frame.error);
    return;
  }
  const image = frame.bitmap;
  if (stage.clientWidth===frame.width && stage.clientHeight===frame.height) {
    if (map.width!==image.width || map.height!==image.height) {
      map.width=image.width;
      map.height=image.height;
    }
    context.clearRect(0,0,map.width,map.height);
    context.drawImage(image,0,0);
    loading.hidden = true;
    if (positionedCamera!==frame.cameraKey) {
      positionedCamera = frame.cameraKey;
      byId('needle').style.transform = 'rotate('+frame.angle+'deg)';
      byId('scale-line').style.width = frame.scale+'px';
      positionStamps(frame.points,frame.width,frame.height);
    }
  }
  image.close?.();
  flushFrame();
}
function positionStamps(points,width,height) {
  const taken = [];
  for (let index=0; index<points.length; index++) {
    const button = stampButtons.get(records[index].id);
    const [x,y] = points[index];
    button.hidden = x<5 || x>width-5 || y<39 || y>height-5;
    if (button.hidden) continue;
    const half = button.offsetWidth/2;
    const offset = records[index].id==='view' ? (smallScreen.matches ? 66 : 89) : 0;
    const boundedX = clamp(x+offset,half+7,width-half-7);
    let lift = 14;
    for (const marker of taken) {
      if (Math.abs(boundedX-marker.x)<half+marker.half+5 && Math.abs(y-lift-marker.bottom)<48) {
        lift = y-marker.bottom+51;
      }
    }
    lift=clamp(lift,14,Math.max(14,y-45));
    taken.push({x:boundedX,half,bottom:y-lift});
    button.style.left = boundedX+'px';
    button.style.top = y+'px';
    const anchorOffset = x-boundedX;
    button.style.setProperty('--lift',lift+'px');
    button.style.setProperty('--anchor-offset',anchorOffset+'px');
    button.style.setProperty('--leader',Math.hypot(anchorOffset,lift)+'px');
    button.style.setProperty('--leader-angle',Math.atan2(-anchorOffset,lift)+'rad');
  }
}
function fail(error) {
  console.error(error);
  setPlaying(false);
  playback.disabled = true;
  loading.hidden = false;
  loading.textContent = '街景無法載入，仍可從收藏列表查看照片和筆記。';
}
function restartWithoutWorker(reason) {
  worker?.terminate();
  worker = null;
  busy = false;
  try {
    frameRenderer = new Function('self.PAGE_SEARCH="";'+engine+'\nreturn renderFrame;')();
    scheduleDraw();
  } catch(error) {
    fail(error || reason);
  }
}
try {
  const entry = 'self.PAGE_SEARCH="";'+engine+
    '\nself.onmessage=({data})=>{try{const frame=renderFrame(data);self.postMessage({...frame,cameraKey:data.cameraKey},[frame.bitmap]);}catch(error){self.postMessage({error:String(error.stack || error)});}};';
  const workerURL = URL.createObjectURL(new Blob([entry],{type:'text/javascript'}));
  worker = new Worker(workerURL);
  URL.revokeObjectURL(workerURL);
  worker.onmessage = ({data}) => displayFrame(data);
  worker.onerror = event => restartWithoutWorker(event.message);
} catch(error) {
  restartWithoutWorker(error);
}

function updateCamera(update) {
  Object.assign(camera,update);
  camera.pitch = clamp(camera.pitch,19,77);
  camera.zoom = clamp(camera.zoom,.72,2.15);
  byId('in').disabled = camera.zoom>=2.15;
  byId('out').disabled = camera.zoom<=.72;
  byId('bird').setAttribute('aria-pressed',String(camera.pitch>=72));
  scheduleDraw();
}
function zoom(factor) { updateCamera({zoom:camera.zoom*factor}); }
for (const id of ['out','in','turn','bird','reset']) byId(id).innerHTML = icon(id);
byId('in').onclick = () => zoom(1.25);
byId('out').onclick = () => zoom(.8);
byId('turn').onclick = () => updateCamera({yaw:camera.yaw+35});
byId('bird').onclick = () => updateCamera({pitch:camera.pitch>=72?34:77,zoom:1,z:camera.pitch>=72?55:25});
byId('reset').onclick = () => updateCamera(defaultCamera());
playback.onclick = () => setPlaying(!playing);
reducedMotion.addEventListener('change', event => {
  if (event.matches) setPlaying(false);
});
document.addEventListener('visibilitychange', syncPlayback);
if ('oncontentvisibilityautostatechange' in stage) {
  stage.addEventListener('contentvisibilityautostatechange', event => {
    renderingStage = !event.skipped;
    syncPlayback();
  });
} else {
  new IntersectionObserver(([entry]) => {
    renderingStage = entry.isIntersecting;
    syncPlayback();
  }, {rootMargin:'120px'}).observe(stage);
}
setPlaying(playing);

map.addEventListener('keydown', event => {
  const change = {
    ArrowLeft:{yaw:camera.yaw-12},ArrowRight:{yaw:camera.yaw+12},
    ArrowUp:{pitch:camera.pitch+5},ArrowDown:{pitch:camera.pitch-5},Home:defaultCamera(),
    '+':{zoom:camera.zoom*1.25},'=':{zoom:camera.zoom*1.25},'-':{zoom:camera.zoom*.8}
  }[event.key];
  if (!change) return;
  event.preventDefault();
  updateCamera(change);
});

const pointers = new Map();
let gestureStart;
function setGestureStart() {
  const [first,second] = [...pointers.values()];
  gestureStart = first ? {first,camera:{...camera},distance:second?Math.hypot(second.x-first.x,second.y-first.y):0} : null;
  map.classList.toggle('dragging',pointers.size>0);
}
map.addEventListener('pointerdown', event => {
  if (event.button!==0) return;
  map.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  setGestureStart();
});
map.addEventListener('pointermove', event => {
  if (!map.hasPointerCapture(event.pointerId) || !gestureStart) return;
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  const [first,second] = [...pointers.values()];
  if (second && gestureStart.distance>0) {
    zoomFromPinch(first,second);
    return;
  }
  updateCamera({
    yaw:gestureStart.camera.yaw-(first.x-gestureStart.first.x)*.48,
    pitch:gestureStart.camera.pitch+(first.y-gestureStart.first.y)*.17
  });
});
function zoomFromPinch(first,second) {
  const distance = Math.hypot(second.x-first.x,second.y-first.y);
  updateCamera({zoom:gestureStart.camera.zoom*distance/gestureStart.distance});
}
map.addEventListener('lostpointercapture', event => {
  pointers.delete(event.pointerId);
  setGestureStart();
});
map.addEventListener('wheel', event => {
  if (!event.ctrlKey && !event.metaKey) return;
  event.preventDefault();
  zoom(event.deltaY<0?1.09:.92);
},{passive:false});
new ResizeObserver(scheduleDraw).observe(stage);
selectRecord(records[0],false);
updateCamera(defaultCamera());

</script>
</body>
</html>
